overrides:
  - package: esbuild
    ecosystem: bun
    manifest: package.json
    override: "^0.28.2"
    fixed_in: 0.25.0
    advisory: GHSA-67mh-4wv8-2f99
    parents: [drizzle-kit]
    reason: drizzle-kit@0.31.11 depends on the deprecated @esbuild-kit/esm-loader, whose @esbuild-kit/core-utils pins esbuild ~0.18.20, which lets any website read responses from the dev server. Fixed in 0.25.0.
    added: 2026-10-18
    owner: "@Sumedhbhat"

  - package: postcss-selector-parser
    ecosystem: bun
    manifest: package.json
    override: "^7.1.6"
    fixed_in: 7.1.6
    advisory: GHSA-rj75-hqrm-r3gf
    parents: ["@tailwindcss/typography"]
    reason: "@tailwindcss/typography@0.5.20 pins postcss-selector-parser 6.0.10, which has quadratic-time parsing of flat selectors (CPU exhaustion). Fixed in 7.1.6."
    added: 2026-10-18
    owner: "@Sumedhbhat"

  - package: "@hono/node-server"
    ecosystem: bun
    manifest: package.json
    override: "^1.19.10"
    fixed_in: 1.19.10
    advisory: GHSA-wc8c-qw6v-h7f6
    parents: [alchemy]
    reason: "alchemy@2.0.0-beta.81 depends on @prisma/dev@0.20.0, which pins @hono/node-server 1.19.9, whose static file middleware lets encoded slashes bypass path authorization. Fixed in 1.19.10."
    added: 2026-10-19
    owner: "@Sumedhbhat"

  - package: hono
    ecosystem: bun
    manifest: package.json
    override: "^4.12.4"
    fixed_in: 4.12.4
    advisory: GHSA-q5qw-h33p-qvwr
    parents: [alchemy]
    reason: "alchemy@2.0.0-beta.81 depends on @prisma/dev@0.20.0, which pins hono 4.11.4, whose serveStatic allows arbitrary file access and whose CORS middleware reflects any origin with credentials (GHSA-88fw-hqm2-52qc). Fixed in 4.12.4."
    added: 2026-10-19
    owner: "@Sumedhbhat"

  - package: lodash
    ecosystem: bun
    manifest: package.json
    override: "^4.18.0"
    fixed_in: 4.18.0
    advisory: GHSA-r5fr-rjxr-66jc
    parents: [alchemy]
    reason: "alchemy@2.0.0-beta.81 reaches lodash 4.17.21 through @prisma/dev and chevrotain, whose _.template allows code injection through imports key names. Fixed in 4.18.0."
    added: 2026-10-19
    owner: "@Sumedhbhat"
