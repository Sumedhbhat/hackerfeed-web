overrides:
  - package: esbuild
    ecosystem: bun
    manifest: package.json
    override: "^0.28.2"
    fixed_in: 0.25.0
    advisory: GHSA-67mh-4wv8-2f99
    parents: [drizzle-kit]
    reason: drizzle-kit@0.31.11 depends on the deprecated @esbuild-kit/esm-loader, whose @esbuild-kit/core-utils pins esbuild ~0.18.20, which lets any website read responses from the dev server. Fixed in 0.25.0.
    added: 2026-10-18
    owner: "@Sumedhbhat"

  - package: postcss-selector-parser
    ecosystem: bun
    manifest: package.json
    override: "^7.1.6"
    fixed_in: 7.1.6
    advisory: GHSA-rj75-hqrm-r3gf
    parents: ["@tailwindcss/typography"]
    reason: "@tailwindcss/typography@0.5.20 pins postcss-selector-parser 6.0.10, which has quadratic-time parsing of flat selectors (CPU exhaustion). Fixed in 7.1.6."
    added: 2026-10-18
    owner: "@Sumedhbhat"

  - package: undici
    ecosystem: bun
    manifest: package.json
    override: "^7.30.1"
    fixed_in: 7.30.1
    advisory: GHSA-xjj6-f33q-929c
    parents: [wrangler, "@cloudflare/vite-plugin"]
    reason: "Every miniflare release up to 5.20261019.2-beta (via wrangler@4.151.0 and @cloudflare/vite-plugin@1.64.0) pins undici exactly at 7.29.1, which has a DoS on excessive content-encodings (GHSA-xjj6-f33q-929c), an EventSource memory DoS (GHSA-4qv8-2p9j-2685) and an SRI bypass (GHSA-f72v-6w45-q472). Fixed in 7.30.1."
    added: 2026-10-24
    owner: "@Sumedhbhat"
