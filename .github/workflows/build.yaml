name: Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The checkout is the PR merged into master; its first parent is master.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      # Also runs shellcheck on every `run:` script (preinstalled on the runner).
      - name: Lint GitHub workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Test infrastructure tooling (local only)
        run: |
          python3 -m unittest discover -s infra/tests -p 'test_*.py' -v
          bun test infra/tests/state-backend.test.js

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Verify build has no demo data
        run: |
          if grep -rlF hackerfeed-demo-data dist; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi

      - name: Detect infrastructure changes
        id: changes
        run: |
          if git diff --quiet HEAD^1 HEAD -- infra/; then
            echo "infra=false" >> "$GITHUB_OUTPUT"
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Terraform
        if: steps.changes.outputs.infra == 'true'
        run: |
          terraform -chdir=infra/terraform fmt -check
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
