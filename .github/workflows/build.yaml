name: Build

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The checkout is the PR merged into master; its first parent is master.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Shadow mode: records what affected CI would select (base: master,
      # head: the merge result). The Build suite still checks every project.
      - name: Record affected projects
        run: bunx nx show projects --affected --base=HEAD^1 --head=HEAD | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Install Chromium system dependencies
        working-directory: apps/web-e2e
        run: bun run playwright install-deps chromium

      - name: Run Build checks
        run: bash scripts/check-build.sh

      - name: Upload end-to-end results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-results
          path: apps/web-e2e/test-results
          retention-days: 7
          if-no-files-found: ignore
