# Shadow mode: retire-overrides evaluates every override and vulnerable package, and reports
# what it would do in the job summary. It opens and removes nothing. The ledger
# (.github/dependency-overrides.yml) and dependency-overrides.yml stay in charge until we switch over.
name: retire-overrides

on:
  schedule:
    - cron: "41 6 * * *" # daily, after dependency-overrides.yml
  push:
    branches: [master]
    paths: [package.json, bun.lock, .github/retire-overrides.yml]
  pull_request:
    paths: [package.json, bun.lock, .github/retire-overrides.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire-overrides:
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v0.3.0 commit, since tags can move. The action checks out this repository itself.
      - uses: Sumedhbhat/retire-overrides@034cb0467f6dcf5ec8073dcb5feb605c9879046a # v0.3.0
        with:
          mode: check # shadow mode: always read-only, no token
          fail-on: "" # shadow mode never fails a build
          bun-version: 1.3.0 # same Bun as build.yaml; Bun's override semantics change at 1.4
