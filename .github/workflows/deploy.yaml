name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

# DEPLOY_TARGET (repository variable) picks the host: cloudflare (default) or
# node, which runs the Docker image on the daemon DOCKER_HOST points at.
# TF_BACKEND_CONFIG holds infra/terraform/backend.hcl (see backend.hcl.example)
# and AWS_* the state bucket's S3 credentials.
env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'cloudflare' }}
  STAGE: prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Initialise Terraform
        run: |
          printf '%s\n' "$TF_BACKEND_CONFIG" > infra/terraform/backend.hcl
          terraform -chdir=infra/terraform init -input=false -backend-config=backend.hcl
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}

      # Read by both the build (client config) and Terraform (runtime env).
      - name: Set production redirect URI
        run: |
          redirect_uri=$(sed -n 's/^VITE_WORKOS_REDIRECT_URI=//p' .env.production)
          {
            echo "VITE_WORKOS_REDIRECT_URI=${redirect_uri}"
            echo "TF_VAR_workos_redirect_uri=${redirect_uri}"
          } >> "$GITHUB_ENV"

      - name: Build
        run: bun run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Verify build has no demo data
        run: |
          if grep -rlF hackerfeed-demo-data .output; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi

      - name: Apply
        run: |
          terraform -chdir=infra/terraform workspace select -or-create "$STAGE"
          terraform -chdir=infra/terraform apply -input=false -auto-approve -var "deploy_target=${DEPLOY_TARGET}"
        env:
          TF_VAR_workos_client_id: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          TF_VAR_ai_token_encryption_key: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          TF_VAR_sentry_dsn: ${{ secrets.VITE_SENTRY_DSN }}
          TF_VAR_sentry_release: ${{ github.sha }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
