name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

# DEPLOY_TARGET (repository variable) picks the host: cloudflare (default) or
# node, which runs the Docker image on the daemon DOCKER_HOST points at.
env:
  DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'cloudflare' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Run tests
        run: bun run test

      # Read by both the build (client config) and the stack (runtime env).
      - name: Set production redirect URI
        run: sed -n 's/^VITE_WORKOS_REDIRECT_URI=/VITE_WORKOS_REDIRECT_URI=/p' .env.production >> "$GITHUB_ENV"

      - name: Build
        run: bun run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Verify build has no demo data
        run: |
          if grep -rlF hackerfeed-demo-data .output; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi

      - name: Deploy
        run: bunx alchemy deploy --stage prod --no-input
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          SENTRY_RELEASE: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
