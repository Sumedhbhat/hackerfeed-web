name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # Which parts of infra/ the push changed. Manual runs, and pushes whose
  # previous commit is unknown, count as changing everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      state_backend: ${{ steps.diff.outputs.state_backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect infrastructure changes
        id: diff
        run: |
          changed() {
            ! { [ "$EVENT" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null &&
              git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$1"; }
          }
          if changed infra/; then echo "infra=true"; else echo "infra=false"; fi >> "$GITHUB_OUTPUT"
          if changed infra/state-backend/; then echo "state_backend=true"; else echo "state_backend=false"; fi >> "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}

  # The Terraform state server sits below Terraform, so wrangler deploys it.
  state-backend:
    needs: changes
    if: needs.changes.outputs.state_backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy state server
        run: |
          bunx wrangler d1 migrations apply DB --remote -c infra/state-backend/wrangler.jsonc
          bunx wrangler deploy -c infra/state-backend/wrangler.jsonc

  infrastructure:
    needs: [changes, state-backend]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.infra == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Plan infrastructure
        run: |
          infra/terraform.sh prod plan -input=false -out=tfplan
          {
            echo '### Production infrastructure plan'
            echo '```'
            infra/terraform.sh prod show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to replace or delete the production database
        run: |
          if infra/terraform.sh prod show -json tfplan | jq -e \
            '[.resource_changes[]? | select(.type == "cloudflare_d1_database" and (.change.actions | index("delete")))] | length > 0' > /dev/null; then
            echo "The plan deletes or replaces the production D1 database" >&2
            exit 1
          fi

      - name: Apply infrastructure
        run: infra/terraform.sh prod apply -input=false tfplan

  deploy:
    needs: infrastructure
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Verify build has no demo data
        run: |
          if grep -rlF hackerfeed-demo-data dist; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi

      - name: Apply database migrations
        run: bunx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secrets are uploaded with the deploy rather than via `wrangler secret
      # bulk`, which refuses to run while a PR preview version is the latest
      # (undeployed) version.
      - name: Write Worker secrets file
        run: |
          jq -n 'env | {SENTRY_DSN, VITE_SENTRY_DSN, VITE_WORKOS_CLIENT_ID, AI_TOKEN_ENCRYPTION_KEY}' \
            > "$RUNNER_TEMP/worker-secrets.json"
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --secrets-file ${{ runner.temp }}/worker-secrets.json --var SENTRY_RELEASE:${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
