name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Verify build has no demo data
        run: |
          if grep -rlF hackerfeed-demo-data dist; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi

      # The first apply adopts the existing Worker and database; see
      # infra/terraform/main.tf.
      - name: Deploy with Terraform
        run: |
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform workspace select -or-create prod
          terraform -chdir=infra/terraform apply -input=false -auto-approve
        env:
          PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN_STR }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_workos_client_id: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          TF_VAR_ai_token_encryption_key: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          TF_VAR_sentry_dsn: ${{ secrets.VITE_SENTRY_DSN }}
          TF_VAR_sentry_release: ${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
