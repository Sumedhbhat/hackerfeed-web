name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  # Read-only work runs without approval, so the run is checked and its
  # infrastructure plan is in the summary before anyone approves.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun run security:audit

      - name: Run lint
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

  # The same read-only plan PRs get, from preview's read access to prod state.
  plan:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Read preview token
        run: exec tools/infra-ci/cloudflare-token.sh prod preview_token

      - name: Plan production infrastructure
        run: |
          source tools/infra-ci/ci-signals.sh
          run tools/infra-ci/terraform.sh prod plan -input=false -lock=false -out=tfplan
          {
            echo '### Production infrastructure plan'
            echo '```'
            run tools/infra-ci/terraform.sh prod show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one job that changes production, and the one approval. Reconcile every
  # run, including changes missed by failed or superseded runs and shared root
  # dependency updates. The state server sits below Terraform, so wrangler
  # deploys it first. CLOUDFLARE_API_TOKEN is the one stored Cloudflare token:
  # it runs Terraform, which mints the others.
  deploy:
    needs: [checks, plan]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy state server
        run: |
          bunx wrangler d1 migrations apply DB --remote -c apps/state-backend/wrangler.jsonc
          bunx wrangler deploy -c apps/state-backend/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Plan infrastructure
        run: |
          source tools/infra-ci/ci-signals.sh
          for stage in prod deploy; do
            run tools/infra-ci/terraform.sh "$stage" plan -input=false -out=tfplan
            {
              echo "### Production infrastructure plan ($stage)"
              echo '```'
              run tools/infra-ci/terraform.sh "$stage" show -no-color tfplan
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply infrastructure
        run: |
          source tools/infra-ci/ci-signals.sh
          run tools/infra-ci/terraform.sh prod apply -input=false tfplan
          run tools/infra-ci/terraform.sh deploy apply -input=false tfplan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Read production database
        run: |
          source tools/infra-ci/ci-signals.sh
          run tools/infra-ci/terraform.sh prod output -raw database_id > "$RUNNER_TEMP/database-id"
          run tools/infra-ci/terraform.sh prod output -raw database_name > "$RUNNER_TEMP/database-name"
          {
            echo "D1_DATABASE_ID=$(cat "$RUNNER_TEMP/database-id")"
            echo "D1_DATABASE_NAME=$(cat "$RUNNER_TEMP/database-name")"
          } >> "$GITHUB_ENV"

      - name: Preserve encrypted Terraform recovery state
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-recovery-prod
          path: |
            ${{ runner.temp }}/terraform-recovery/**/*.enc
            ${{ runner.temp }}/terraform-recovery/**/*.hmac
          retention-days: 1
          if-no-files-found: ignore

      - name: Build
        run: |
          test -n "$D1_DATABASE_ID"
          test -n "$D1_DATABASE_NAME"
          bun run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: production
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Verify build
        run: |
          if grep -rlF hackerfeed-demo-data apps/web/dist; then
            echo "Production build includes fixtures; VITE_DEMO_DATA must not be set" >&2
            exit 1
          fi
          bound=$(jq -r '.d1_databases[] | select(.binding == "DB") | .database_id' apps/web/dist/server/wrangler.json)
          if [ "$bound" != "$D1_DATABASE_ID" ]; then
            echo "Build binds DB to '${bound}', not Terraform's database" >&2
            exit 1
          fi

      # Later steps get the Terraform-minted deploy token, not the stored one.
      - name: Read deploy token
        run: exec tools/infra-ci/cloudflare-token.sh deploy deploy_token

      - name: Apply database migrations
        run: bunx wrangler d1 migrations apply DB --remote --config apps/web/dist/server/wrangler.json

      # Upload secrets with the same production config as the Worker.
      - name: Write Worker secrets file
        run: |
          jq -n 'env | {SENTRY_DSN, VITE_SENTRY_DSN, VITE_WORKOS_CLIENT_ID, AI_TOKEN_ENCRYPTION_KEY}' \
            > "$RUNNER_TEMP/worker-secrets.json"
        env:
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config apps/web/dist/server/wrangler.json --secrets-file ${{ runner.temp }}/worker-secrets.json --var SENTRY_RELEASE:${{ github.sha }}
