name: Dependency overrides

on:
  schedule:
    - cron: "17 6 * * *"            # daily
  push:
    branches: [master]
    paths: [bun.lock]               # right after a parent bump lands
  pull_request:
    paths: [package.json, .github/dependency-overrides.yml, scripts/check-dependency-overrides.sh]
  workflow_dispatch:

jobs:
  # On PRs: every override has a complete ledger entry, and every ledger entry has an override.
  ledger:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check dependency override ledger
        run: bash scripts/check-dependency-overrides.sh

  # Everywhere else: try removing each override and open PRs for the ones that can go.
  remove:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read                # writes go through DEPS_BOT_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.DEPS_BOT_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0
      - run: |
          git config user.name "deps-bot"
          git config user.email "deps-bot@users.noreply.github.com"
      - run: scripts/check-bun-overrides.sh --open-prs
        env:
          GH_TOKEN: ${{ secrets.DEPS_BOT_TOKEN }}
