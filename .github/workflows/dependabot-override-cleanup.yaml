name: Dependabot Override Cleanup

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: dependabot-override-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prune:
    name: Prune redundant overrides
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prune redundant security overrides
        run: bun run security:overrides --write

      - name: Validate cleanup scope
        id: cleanup
        shell: bash
        run: |
          changed_files="$(git diff --name-only)"

          if [ -z "$changed_files" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unexpected_files="$(printf '%s\n' "$changed_files" | grep -Ev '^(package.json|bun.lock)$' || true)"
          if [ -n "$unexpected_files" ]; then
            echo "Override cleanup changed unexpected files:" >&2
            printf '%s\n' "$unexpected_files" >&2
            exit 1
          fi

          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify pruned dependency graph
        if: steps.cleanup.outputs.changed == 'true'
        run: |
          bun install --frozen-lockfile
          bun run security:audit
          bun run security:overrides

      - name: Commit cleanup
        if: steps.cleanup.outputs.changed == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git -c commit.gpgSign=false -c core.hooksPath=/dev/null \
            commit -m "chore(deps): prune redundant security overrides"

      - name: Push cleanup to Dependabot branch
        if: steps.cleanup.outputs.changed == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.DEPENDABOT_PRUNE_DEPLOY_KEY }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPENDABOT_PRUNE_DEPLOY_KEY is not configured." >&2
            exit 1
          fi

          git check-ref-format --branch "$HEAD_REF"

          current_head="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_head" != "$EXPECTED_HEAD" ]; then
            echo "Dependabot updated the branch during cleanup. A new run will handle it." >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/dependabot-prune-key"
          known_hosts_file="$RUNNER_TEMP/dependabot-prune-known-hosts"
          trap 'rm -f "$key_file" "$known_hosts_file"' EXIT

          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          ssh-keyscan -H github.com > "$known_hosts_file" 2>/dev/null

          remote="git@github.com:$REPOSITORY.git"
          ssh_command="ssh -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_file"
          git -c core.hooksPath=/dev/null -c core.sshCommand="$ssh_command" \
            push "$remote" "HEAD:refs/heads/$HEAD_REF"
