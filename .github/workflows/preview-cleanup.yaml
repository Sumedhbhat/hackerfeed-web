name: Clean up preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its stage is destroyed.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (vars.DEPLOY_TARGET || 'cloudflare') == 'cloudflare'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_TARGET: cloudflare
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Destroy evaluates the stack too, so it needs the same settings.
      - name: Destroy preview stage
        run: |
          VITE_WORKOS_REDIRECT_URI=$(sed -n 's/^VITE_WORKOS_REDIRECT_URI=//p' .env.production)
          export VITE_WORKOS_REDIRECT_URI
          bunx alchemy destroy --stage "$STAGE" --no-input
        env:
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
