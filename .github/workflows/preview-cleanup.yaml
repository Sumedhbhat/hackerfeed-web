name: Clean up Cloudflare preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its database is destroyed.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Destroy preview infrastructure
        run: |
          # `state list` fails on a stage with no state yet; `show` doesn't.
          state=$(infra/terraform.sh "$STAGE" show -json)
          if [ "$(jq '[.values.root_module.resources[]?] | length' <<< "$state")" = 0 ]; then
            echo "Nothing to destroy for ${STAGE}"
          else
            infra/terraform.sh "$STAGE" destroy -input=false -auto-approve
          fi
          infra/terraform.sh "$STAGE" delete-state
