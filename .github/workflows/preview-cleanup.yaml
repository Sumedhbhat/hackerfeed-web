name: Clean up Cloudflare preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its workspace is destroyed.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN_STR }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      # Terraform reads the Worker settings from the build output.
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # The secrets below only satisfy required variables; nothing is deployed.
      - name: Destroy preview workspace
        run: |
          terraform -chdir=infra/terraform init -input=false
          if ! terraform -chdir=infra/terraform workspace select "$STAGE"; then
            echo "No workspace named ${STAGE}"
            exit 0
          fi
          terraform -chdir=infra/terraform destroy -input=false -auto-approve \
            -var workos_client_id=unused -var ai_token_encryption_key=unused
          terraform -chdir=infra/terraform workspace select default
          terraform -chdir=infra/terraform workspace delete "$STAGE"
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
