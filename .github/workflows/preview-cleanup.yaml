name: Clean up Cloudflare preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its database is destroyed.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Adopt legacy preview database
        id: database_state
        run: python3 infra/preview_database.py "$STAGE"

      - name: Destroy preview infrastructure
        run: |
          if [ "$EXISTS" != true ] && [ "$EXISTS" != false ]; then
            echo "Preview database discovery did not return a valid result" >&2
            exit 1
          fi
          if [ "$EXISTS" = true ]; then
            infra/terraform.sh "$STAGE" destroy -input=false -auto-approve
          fi
          infra/terraform.sh "$STAGE" delete-state
        env:
          EXISTS: ${{ steps.database_state.outputs.exists }}

      - name: Preserve encrypted Terraform recovery state
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-recovery-preview-cleanup
          path: |
            ${{ runner.temp }}/terraform-recovery/**/*.enc
            ${{ runner.temp }}/terraform-recovery/**/*.hmac
          retention-days: 1
          if-no-files-found: ignore
