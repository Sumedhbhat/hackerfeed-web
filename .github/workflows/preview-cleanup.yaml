name: Clean up Cloudflare preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its stage is destroyed.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      # The stack reads the Worker settings from the build output.
      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build

      # The secrets below only satisfy required config; nothing is deployed.
      - name: Destroy preview stage
        run: bunx alchemy destroy --stage "$STAGE" --no-input --yes
        env:
          VITE_WORKOS_CLIENT_ID: unused
          AI_TOKEN_ENCRYPTION_KEY: unused
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
