name: Clean up preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its workspace is destroyed.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (vars.DEPLOY_TARGET || 'cloudflare') == 'cloudflare'
    runs-on: ubuntu-latest
    environment: dev
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      PG_CONN_STR: ${{ secrets.TF_STATE_PG_CONN_STR }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Initialise Terraform
        run: terraform -chdir=infra/terraform init -input=false

      # The values below only satisfy required variables; nothing is deployed.
      - name: Destroy preview workspace
        run: |
          if ! terraform -chdir=infra/terraform workspace select "$STAGE"; then
            echo "No workspace named ${STAGE}"
            exit 0
          fi
          terraform -chdir=infra/terraform destroy -input=false -auto-approve \
            -var deploy_target=cloudflare -var workos_redirect_uri=unused \
            -var workos_client_id=unused -var ai_token_encryption_key=unused
          terraform -chdir=infra/terraform workspace select default
          terraform -chdir=infra/terraform workspace delete "$STAGE"
        env:
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
