name: Clean up Cloudflare preview

on:
  pull_request:
    types: [closed]
    branches: [master]

permissions:
  contents: read

# Shares the preview workflow's group so closing a PR cancels an in-flight
# preview before its database is deleted.
concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Delete preview database
        run: |
          db_name="hackerfeed-web-pr-${PR_NUMBER}"
          if bunx wrangler d1 list --json | jq -e --arg name "$db_name" 'any(.[]; .name == $name)' > /dev/null; then
            bunx wrangler d1 delete "$db_name" --skip-confirmation
          else
            echo "No preview database named ${db_name}"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
