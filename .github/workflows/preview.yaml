name: Preview on Cloudflare

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan-production:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      # PR jobs hold no stored Cloudflare token: Terraform mints this one.
      - name: Read preview token
        run: exec tools/infra-ci/cloudflare-token.sh prod preview_token

      - name: Plan production infrastructure
        run: |
          source tools/infra-ci/ci-signals.sh
          run tools/infra-ci/terraform.sh prod plan -input=false -lock=false -out=tfplan
          {
            echo '### Production infrastructure plan'
            echo '```'
            run tools/infra-ci/terraform.sh prod show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve encrypted Terraform recovery state
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: terraform-recovery-preview-production-plan
          path: |
            ${{ runner.temp }}/terraform-recovery/**/*.enc
            ${{ runner.temp }}/terraform-recovery/**/*.hmac
          retention-days: 1
          if-no-files-found: ignore

  preview:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static demo
        run: bun run build:demo

      - name: Verify static demo
        run: |
          test -s apps/web/dist/client/index.html
          if ! grep -rqF hackerfeed-demo-data apps/web/dist/client; then
            echo "Demo fixtures are missing from the static client" >&2
            exit 1
          fi

      - name: Read preview token
        run: exec tools/infra-ci/cloudflare-token.sh prod preview_token

      - name: Upload preview version
        run: |
          bunx wrangler versions upload --config apps/web/wrangler.preview.jsonc --preview-alias "pr-${PR_NUMBER}" --message "PR #${PR_NUMBER} @ ${HEAD_SHA}"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson

      - name: Comment preview URL on PR
        run: |
          alias_url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          version_url=$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n1)
          if [ -z "$alias_url" ] || [ -z "$version_url" ]; then
            echo "Missing preview URLs in wrangler output" >&2
            exit 1
          fi

          marker='<!-- cloudflare-preview -->'
          body="$marker
          ## Cloudflare preview

          | | |
          |-|-|
          | **Branch preview** | $alias_url |
          | **Commit preview** | $version_url |
          | **Commit** | \`${HEAD_SHA:0:7}\` |

          Fixture-backed static demo. Fixed demo session; favorites and views reset on refresh. No database, real sign-in, or AI connections. Does not validate migrations or backend behavior."

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
