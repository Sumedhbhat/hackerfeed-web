name: Preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork and Dependabot PRs cannot read the `dev` environment secrets.
    # Previews need a public URL per stage, which only the cloudflare target
    # gives without extra setup.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (vars.DEPLOY_TARGET || 'cloudflare') == 'cloudflare'
    runs-on: ubuntu-latest
    environment: dev
    env:
      DEPLOY_TARGET: cloudflare
      STAGE: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The stage's Worker is named hackerfeed-web-pr-<n>, so its workers.dev
      # host is the production host with that name swapped in.
      - name: Set preview URL
        run: |
          prod_host=$(sed -n 's|^VITE_WORKOS_REDIRECT_URI=https://\([^/]*\)/.*|\1|p' .env.production)
          if [ -z "$prod_host" ]; then
            echo "No production redirect URI in .env.production" >&2
            exit 1
          fi
          preview_url="https://hackerfeed-web-${STAGE}.${prod_host#*.}"
          echo "PREVIEW_URL=${preview_url}" >> "$GITHUB_ENV"
          echo "VITE_WORKOS_REDIRECT_URI=${preview_url}/auth/callback" >> "$GITHUB_ENV"

      # VITE_DEMO_DATA builds in the in-memory Hacker News API that serves
      # src/demo-data/hacker-news.ts instead of the live API.
      - name: Build
        run: bun run build
        env:
          VITE_DEMO_DATA: "true"
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}

      - name: Verify build serves demo data
        run: |
          if ! grep -rqF hackerfeed-demo-data .output; then
            echo "Preview build does not include the demo Hacker News API" >&2
            exit 1
          fi

      # The stage gets its own D1 database, migrated and loaded with
      # src/demo-data/database by the stack.
      - name: Deploy preview stage
        run: bunx alchemy deploy --stage "$STAGE" --no-input
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          AI_TOKEN_ENCRYPTION_KEY: ${{ secrets.AI_TOKEN_ENCRYPTION_KEY }}
          SENTRY_RELEASE: ${{ github.event.pull_request.head.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        run: |
          marker='<!-- alchemy-preview -->'
          body="$marker
          ## Preview

          | | |
          |-|-|
          | **URL** | $PREVIEW_URL |
          | **Commit** | \`${HEAD_SHA:0:7}\` |

          Shows only the dummy data in \`src/demo-data\`: its own D1 database (stage \`${STAGE}\`, destroyed when the PR closes) and an in-memory Hacker News API. Uses production secrets."

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty")
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
